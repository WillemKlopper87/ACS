server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No client-side router is in use today (no react-router in
    # package.json — screens are in-app state, not URL routes), but the
    # fallback costs nothing and avoids a 404 trap if that ever changes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
