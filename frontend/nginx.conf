server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No client-side router is in use today (no react-router in
    # package.json — screens are in-app state, not URL routes), but the
    # fallback costs nothing and avoids a 404 trap if that ever changes.
    # Browser-side hardening (audit P1.5 / missing security headers).
    # HSTS is intentionally not set here: this listener is plain HTTP
    # behind whatever terminates TLS; emit Strict-Transport-Security from
    # that TLS-terminating proxy instead. connect-src must name the API
    # origin (VITE_API_BASE_URL) — override this file via a bind mount if
    # the API is not on localhost:8080.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080 ws://localhost:8080 https://localhost:8080 wss://localhost:8080; frame-src 'self' http://localhost:8080 https://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
