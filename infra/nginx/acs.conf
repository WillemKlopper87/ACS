# Unified operator ingress for the host-based quickstart deployment.
#
# Public surface on port 80:
#   /             -> ACS React console (127.0.0.1:5173)
#   /api/         -> ACS REST API      (127.0.0.1:8080)
#   /grafana/     -> Grafana           (127.0.0.1:3000)
#   /prometheus/  -> Prometheus        (127.0.0.1:9090, Basic Auth)
#
# CWMP (:7547/tcp) and STUN (:3478/udp) remain direct device-facing
# listeners and are intentionally not routed through this server block.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2g;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # The API already owns the /api/v1/... namespace. Preserve the URI
    # exactly when forwarding so no application route changes are needed.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /grafana {
        return 301 /grafana/;
    }

    # Grafana is configured with root_url=/grafana/ and
    # serve_from_sub_path=true by scripts/start.sh. Keeping the upstream
    # path intact lets Grafana generate correct asset/API/WebSocket URLs.
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /prometheus {
        return 301 /prometheus/;
    }

    # Prometheus has no native user login. Keep it loopback-only and put
    # HTTP Basic Auth at the ingress. scripts/configure-web-ingress.sh
    # writes this password file from Grafana's generated admin password.
    location /prometheus/ {
        auth_basic "ACS monitoring";
        auth_basic_user_file /etc/nginx/acs-prometheus.htpasswd;

        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the React console. The Python SPA server retains
    # its existing deep-link fallback and browser-security headers.
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
