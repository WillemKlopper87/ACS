global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Targets for the `--profile containerized` workflow, where cmd/acs,
# cmd/api and cmd/bssadapter run as compose services. Select this file by
# setting ACS_PROMETHEUS_CONFIG=prometheus.containerized.yml (see
# infra/.env.containerized.example and the README quick start).
#
# Each service is scraped exactly once. Do not also list
# host.docker.internal here: the containerized services publish these same
# ports on the host, so the two names resolve to one process, and every
# counter would be collected twice — which silently doubles every sum() in
# the dashboards and alert rules.
scrape_configs:
  - job_name: acs
    static_configs:
      - targets: ['acs:7547']
  - job_name: api
    static_configs:
      - targets: ['api:8080']
  - job_name: bssadapter
    static_configs:
      - targets: ['bssadapter:8090']
  - job_name: uspc
    static_configs:
      - targets: ['uspc:8092']
