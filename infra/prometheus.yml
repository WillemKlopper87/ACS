global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

# Alert delivery (audit P3.2): firing alerts go to Alertmanager, which
# routes them per infra/alertmanager.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Targets for the DEFAULT workflow: the three Go services run on the host
# via `go run` (deployment-testing-onboarding-guide.md §3) while Postgres,
# Prometheus, Alertmanager and Grafana run in compose.
#
# This file used to list both host.docker.internal AND the container names
# in every job, on the assumption that "only one set is ever actually
# running at a time; the other just shows down". That assumption is wrong
# for the containerized profile: those containers publish their ports on
# the host, so host.docker.internal reaches the very same process as the
# container name. Both targets came up, every counter was scraped twice,
# and every sum() in a dashboard or alert double-counted — one device
# rendered as two. The container targets now live in
# prometheus.containerized.yml, selected via ACS_PROMETHEUS_CONFIG.
scrape_configs:
  - job_name: acs
    static_configs:
      - targets: ['host.docker.internal:7547']
  - job_name: api
    static_configs:
      - targets: ['host.docker.internal:8080']
  - job_name: bssadapter
    static_configs:
      - targets: ['host.docker.internal:8090']
  - job_name: uspc
    static_configs:
      - targets: ['host.docker.internal:8092']
