# Grafana behind the ACS console's sign-in gate (cmd/api/grafana_gate.go).
#
# Grafana keeps its own origin: here port 3443 on the ACS host's public
# address (or use `listen 443 ssl` + `server_name grafana.<domain>`). Do not
# serve it under the console's origin: a script inside Grafana could then
# read the console's session token from browser storage.
#
# Grafana itself stays on 127.0.0.1:3000 and cmd/api on 127.0.0.1:8080.
# In ~/.acs-secrets.env:
#   export ACS_GRAFANA_GATE="1"
#   export ACS_GRAFANA_URL="https://<host>:3443"
# then rerun scripts/start.sh. Include this file in nginx's http block
# (for example /etc/nginx/conf.d/), fill in the certificate and console
# address, check with `nginx -t` and reload.

map $http_upgrade $acs_grafana_connection {
    default upgrade;
    ""      close;
}

server {
    listen 3443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/acs/fullchain.pem;
    ssl_certificate_key /etc/ssl/acs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Step 2: the console's 30-second ticket becomes the gate's HttpOnly
    # session cookie on this origin, then a redirect to Grafana.
    location = /acs-gate/enter {
        proxy_pass http://127.0.0.1:8080/api/v1/grafana/enter$is_args$args;
        proxy_set_header Host $host;
    }

    # Step 3: every Grafana request is checked against the operator's
    # console session (204 passes, 401 does not).
    location = /_acs_gate {
        internal;
        proxy_pass http://127.0.0.1:8080/api/v1/grafana/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_acs_gate;
        error_page 401 = @acs_console;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Grafana Live (WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $acs_grafana_connection;
    }

    # No valid gate session: back to the console to sign in and click
    # "Grafana" again.
    location @acs_console {
        return 302 https://<console address>/;
    }
}
