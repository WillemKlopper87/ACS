# Network exposure (audit P1.5): only the two ports a CPE or an operator
# must reach from outside are published on all interfaces (CWMP 7547 and
# STUN 3478 on the acs service). Postgres, Prometheus, Grafana, the API,
# the BSS adapter, and the frontend bind to 127.0.0.1 — reach them via a
# TLS-terminating reverse proxy on the host, an SSH tunnel, or by editing
# the bind address deliberately. Set ACS_POSTGRES_PASSWORD and
# GRAFANA_ADMIN_PASSWORD in the shell/.env before `docker compose up`;
# the Postgres default only exists so a throwaway local stack still works.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: ${ACS_POSTGRES_PASSWORD:-acs}
      POSTGRES_DB: acs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - acs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs -d acs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Build plan §4 Phase 7 (Dashboards, Alerting). Scrapes cmd/acs,
  # cmd/api, and cmd/bssadapter's /metrics endpoints — those three run on
  # the host (via `go run`), not in this compose network, so
  # prometheus.yml targets host.docker.internal, which Docker Desktop
  # resolves to the host machine.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - acs_prometheus_data:/prometheus
    depends_on:
      - alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    # ACS_ALERT_WEBHOOK_URL is substituted into the config template at
    # start (Alertmanager has no env expansion of its own) — export it in
    # the shell or .env before `docker compose up`. The default points at
    # a non-existent local receiver so a dev stack boots without one.
    environment:
      ACS_ALERT_WEBHOOK_URL: ${ACS_ALERT_WEBHOOK_URL:-http://host.docker.internal:9999/alerts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s#__ACS_ALERT_WEBHOOK_URL__#$$ACS_ALERT_WEBHOOK_URL#" /etc/alertmanager/alertmanager.tmpl.yml
        > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - acs_alertmanager_data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous access is off and the admin password must be supplied
      # (audit P1.5) — `${VAR:?}` makes compose refuse to start without it.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - acs_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- Containerized app services, opt-in via `--profile containerized` ---
  #
  # Everything above this line stays the default (`docker compose up -d
  # postgres`), matching deployment-testing-onboarding-guide.md's
  # documented host-based workflow (`go run ./cmd/acs`, etc.) exactly as
  # before — these four services are an alternative, not a replacement,
  # closing the "no container image for them yet" gap without breaking
  # that guide. prometheus.yml scrapes both host.docker.internal (dev
  # mode, unchanged) and these services' in-network names (this profile);
  # whichever set isn't actually running just shows "down" in Prometheus,
  # which is harmless.
  acs:
    build:
      context: ../backend
      dockerfile: Dockerfile.acs
    profiles: ["containerized"]
    ports:
      - "7547:7547"
      - "3478:3478/udp"
    env_file: .env.containerized
    environment:
      ACS_POSTGRES_DSN: postgres://acs:${ACS_POSTGRES_PASSWORD:-acs}@postgres:5432/acs?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env.containerized
    environment:
      ACS_POSTGRES_DSN: postgres://acs:${ACS_POSTGRES_PASSWORD:-acs}@postgres:5432/acs?sslmode=disable
      ACS_BSS_ADAPTER_URL: http://bssadapter:8090
    depends_on:
      postgres:
        condition: service_healthy
      acs:
        condition: service_started

  bssadapter:
    build:
      context: ../backend
      dockerfile: Dockerfile.bssadapter
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env.containerized
    environment:
      ACS_INTERNAL_API_URL: http://api:8080
    depends_on:
      - api

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  acs_postgres_data:
  acs_alertmanager_data:
  acs_prometheus_data:
  acs_grafana_data:
