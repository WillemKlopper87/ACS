# Network exposure (audit P1.5): only the two ports a CPE or an operator
# must reach from outside are published on all interfaces by default (CWMP
# 7547 and STUN 3478 on the acs service), plus XMPP 5222 when the opt-in
# "xmpp" profile runs (CPEs connect to it). Postgres, Prometheus, Grafana,
# the API, the BSS adapter, and the frontend otherwise bind to 127.0.0.1.
# For the host-based dev quickstart, scripts/start.sh can deliberately set
# GRAFANA_BIND/PROMETHEUS_BIND to 0.0.0.0 so those UIs are reachable on
# the same public IP at :3000 and :9090. Do not use that exposure model as
# the production hardening target.
# Images are pinned by digest as well as by tag: a tag can be moved to
# different content, a digest cannot. Dependabot (docker-compose) raises
# the digest when a tag is updated.
services:
  postgres:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: ${ACS_POSTGRES_PASSWORD:?set ACS_POSTGRES_PASSWORD}
      POSTGRES_DB: acs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - acs_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs -d acs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Build plan §4 Phase 7 (Dashboards, Alerting). Scrapes cmd/acs,
  # cmd/api, and cmd/bssadapter's /metrics endpoints — those three run on
  # the host (via `go run`), not in this compose network, so
  # prometheus.yml targets host.docker.internal, which Docker Desktop
  # resolves to the host machine.
  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    ports:
      # Localhost by default. scripts/start.sh sets PROMETHEUS_BIND=0.0.0.0
      # only when ACS_PROMETHEUS_PUBLIC=1 (the dev quickstart does this).
      - "${PROMETHEUS_BIND:-127.0.0.1}:9090:9090"
    volumes:
      # ACS_PROMETHEUS_CONFIG selects the target set: prometheus.yml (the
      # default `go run` workflow) or prometheus.containerized.yml (the
      # containerized profile). Scraping both sets at once double-counts
      # every metric, so they are deliberately separate files.
      - ./${ACS_PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - acs_prometheus_data:/prometheus
    depends_on:
      - alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    ports:
      - "127.0.0.1:9093:9093"
    # ACS_ALERT_WEBHOOK_URL is substituted into the config template at
    # start (Alertmanager has no env expansion of its own) — export it in
    # the shell or .env before `docker compose up`. The default points at
    # a non-existent local receiver so a dev stack boots without one.
    environment:
      ACS_ALERT_WEBHOOK_URL: ${ACS_ALERT_WEBHOOK_URL:-http://host.docker.internal:9999/alerts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s#__ACS_ALERT_WEBHOOK_URL__#$$ACS_ALERT_WEBHOOK_URL#" /etc/alertmanager/alertmanager.tmpl.yml
        > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - acs_alertmanager_data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    ports:
      # 127.0.0.1 unless deliberately overridden (audit P1.5):
      # scripts/start.sh sets GRAFANA_BIND=0.0.0.0 only when
      # ACS_GRAFANA_PUBLIC=1, and says what that exposes.
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    environment:
      # Anonymous access is off and the admin password must be supplied
      # (audit P1.5) — `${VAR:?}` makes compose refuse to start without it.
      # scripts/gen-env.sh generates both passwords and writes them to
      # infra/.env, so the scripted deployment satisfies these without a
      # manual pre-step (and without the `unused-postgres-only`
      # interpolation placeholder start.sh used to need).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD (or run scripts/gen-env.sh)}
      # Secure by default: the session cookie is https-only. The scripted
      # EC2 deployment serves everything over plain HTTP, where that makes
      # login silently impossible — the browser never stores the cookie,
      # so a correct password just returns to the login page. gen-env.sh
      # sets this false for that deployment; behind a TLS-terminating
      # proxy, drop the override to get the secure behaviour back.
      GF_SECURITY_COOKIE_SECURE: "${GRAFANA_COOKIE_SECURE:-true}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only Postgres role for the tenancy/BSS/per-device panels
      # (scripts/grafana-db-role.sh creates it). Interpolated into
      # grafana/provisioning/datasources/datasource.yml at startup.
      ACS_GRAFANA_DB_PASSWORD: ${ACS_GRAFANA_DB_PASSWORD:?set ACS_GRAFANA_DB_PASSWORD (or run scripts/gen-env.sh)}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - acs_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # TR-069 Annex K XMPP Connection Request server (docs/XMPP-CONNECTION-REQUEST.md),
  # opt-in via `--profile xmpp` — scripts/start.sh starts it only when
  # ACS_XMPP_ENABLED=1, so a stack without XMPP is unchanged. CGNAT'd CPEs
  # hold an outbound TLS session on 5222; cmd/api connects to it on
  # 127.0.0.1:5222 as the ACS account (an admin, so it can create per-CPE
  # accounts over XEP-0133). Variables use `:-` rather than `:?` on purpose:
  # compose interpolates every service, and a stack without XMPP must not
  # fail to start; the entrypoint refuses to run without them instead.
  # Pinned to the 0.12 release series (the config relies on its
  # `Lua.os.getenv`, foreground-by-default and mod_admin_adhoc behaviour);
  # pin the digest once pulled for a production-like deployment.
  # Lab TLS front door (docs/LAB-TLS.md): Caddy gets a Let's Encrypt certificate
  # for the console, API and BSS adapter names and forwards to the loopback
  # services. Host network so it can reach them and bind 80 and 443 (Linux).
  # scripts/start.sh starts it when the ACS_LAB_* names are set.
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: ["tls"]
    network_mode: host
    restart: unless-stopped
    environment:
      ACS_LAB_TLS_EMAIL: ${ACS_LAB_TLS_EMAIL:-}
      ACS_LAB_FRONTEND_HOST: ${ACS_LAB_FRONTEND_HOST:-}
      ACS_LAB_API_HOST: ${ACS_LAB_API_HOST:-}
      ACS_LAB_BSS_HOST: ${ACS_LAB_BSS_HOST:-}
    volumes:
      - ./ingress/Caddyfile.lab:/etc/caddy/Caddyfile:ro
      - acs_caddy_data:/data
      - acs_caddy_config:/config

  prosody:
    image: prosodyim/prosody:0.12@sha256:01c1fb2dfeb129e8d20edcea5723f4133bee6e715e9c037f3e9ca2110096e4c9
    profiles: ["xmpp"]
    restart: unless-stopped
    ports:
      - "${ACS_XMPP_BIND:-0.0.0.0}:5222:5222"
    environment:
      ACS_XMPP_DOMAIN: ${ACS_XMPP_DOMAIN:-}
      ACS_XMPP_USER: ${ACS_XMPP_USER:-acs}
      ACS_XMPP_PASSWORD: ${ACS_XMPP_PASSWORD:-}
    entrypoint: ["/bin/bash", "/opt/acs/prosody-entrypoint.sh"]
    volumes:
      - ./prosody/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - ./prosody/prosody-entrypoint.sh:/opt/acs/prosody-entrypoint.sh:ro
      # Certificate + key as xmpp.crt / xmpp.key (scripts/xmpp-cert.sh
      # creates a self-signed pair; point ACS_XMPP_CERT_DIR at a directory
      # with a CA-issued pair to replace it).
      - ${ACS_XMPP_CERT_DIR:-./prosody/certs}:/certs:ro
      - acs_prosody_data:/var/lib/prosody
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5222'"]
      interval: 10s
      timeout: 5s
      retries: 6

  # --- Containerized app services, opt-in via `--profile containerized` ---
  #
  # Everything above this line stays the default (`docker compose up -d
  # postgres`), matching deployment-testing-onboarding-guide.md's
  # documented host-based workflow (`go run ./cmd/acs`, etc.) exactly as
  # before — these four services are an alternative, not a replacement,
  # closing the "no container image for them yet" gap without breaking
  # that guide. prometheus.yml scrapes both host.docker.internal (dev
  # mode, unchanged) and these services' in-network names (this profile);
  # whichever set isn't actually running just shows "down" in Prometheus,
  # which is harmless.
  acs:
    build:
      context: ../backend
      dockerfile: Dockerfile.acs
    profiles: ["containerized"]
    ports:
      - "7547:7547"
      - "3478:3478/udp"
    env_file: .env.containerized
    environment:
      ACS_CWMP_POSTGRES_DSN: postgres://acs${ACS_GATEWAY_DB_PASSWORD:+_gateway}:${ACS_GATEWAY_DB_PASSWORD:-${ACS_POSTGRES_PASSWORD:?set ACS_POSTGRES_PASSWORD}}@postgres:5432/acs?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env.containerized
    environment:
      ACS_API_POSTGRES_DSN: postgres://acs${ACS_API_DB_PASSWORD:+_api}:${ACS_API_DB_PASSWORD:-${ACS_POSTGRES_PASSWORD:?set ACS_POSTGRES_PASSWORD}}@postgres:5432/acs?sslmode=disable
      ACS_BSS_ADAPTER_URL: http://bssadapter:8090
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      acs:
        condition: service_started

  bssadapter:
    build:
      context: ../backend
      dockerfile: Dockerfile.bssadapter
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env.containerized
    environment:
      ACS_BSS_POSTGRES_DSN: postgres://acs${ACS_BSS_DB_PASSWORD:+_bss}:${ACS_BSS_DB_PASSWORD:-${ACS_POSTGRES_PASSWORD:?set ACS_POSTGRES_PASSWORD}}@postgres:5432/acs?sslmode=disable
      ACS_INTERNAL_API_URL: http://api:8080
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

  uspc:
    build:
      context: ../backend
      dockerfile: Dockerfile.uspc
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:9877:9877"
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8092:8092"
    env_file: .env.containerized
    environment:
      ACS_USP_POSTGRES_DSN: postgres://acs${ACS_USP_DB_PASSWORD:+_usp}:${ACS_USP_DB_PASSWORD:-${ACS_POSTGRES_PASSWORD:?set ACS_POSTGRES_PASSWORD}}@postgres:5432/acs?sslmode=disable
      ACS_USP_CONTROLLER_ID: ${ACS_USP_CONTROLLER_ID:-uspc-containerized}
      ACS_USP_ALLOW_PLAINTEXT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Database set-up for the containerized profile, in two one-shot steps
  # that finish before any service starts.
  #
  # db-roles creates a login for each service that has a password in
  # infra/.env (ACS_GATEWAY_DB_PASSWORD, ACS_API_DB_PASSWORD,
  # ACS_BSS_DB_PASSWORD, ACS_USP_DB_PASSWORD). migrate then applies the
  # schema migrations as the owner and grants each of those logins the
  # table privileges its service uses. A service with a password connects
  # as its own login and never sees the owner's; one without connects as
  # the owner, as before. Use hex passwords (openssl rand -hex 24): they
  # go into a connection URL unescaped.
  db-roles:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    profiles: ["containerized"]
    restart: "no"
    entrypoint: ["/bin/sh", "/service-roles.sh"]
    volumes:
      - ./postgres/service-roles.sh:/service-roles.sh:ro
    environment:
      PGHOST: postgres
      PGUSER: acs
      PGDATABASE: acs
      PGPASSWORD: ${ACS_POSTGRES_PASSWORD:?set ACS_POSTGRES_PASSWORD}
      ACS_GATEWAY_DB_PASSWORD: ${ACS_GATEWAY_DB_PASSWORD:-}
      ACS_API_DB_PASSWORD: ${ACS_API_DB_PASSWORD:-}
      ACS_BSS_DB_PASSWORD: ${ACS_BSS_DB_PASSWORD:-}
      ACS_USP_DB_PASSWORD: ${ACS_USP_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile.migrate
    profiles: ["containerized"]
    restart: "no"
    environment:
      ACS_POSTGRES_DSN: postgres://acs:${ACS_POSTGRES_PASSWORD:?set ACS_POSTGRES_PASSWORD}@postgres:5432/acs?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    profiles: ["containerized"]
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - api

volumes:
  acs_postgres_data:
  acs_alertmanager_data:
  acs_prometheus_data:
  acs_grafana_data:
  acs_prosody_data:
  acs_caddy_data:
  acs_caddy_config:
