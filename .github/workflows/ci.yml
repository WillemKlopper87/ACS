# Required delivery gate (audit P1.6). Every job must pass before merge;
# configure branch protection on main to require: go, frontend,
# migrations, containers, scan, security, usp-interop.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: backend (fmt, vet, test -race, govulncheck)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: USP protobuf bindings match their .proto
        run: |
          PROTOC_VERSION=29.3
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q -o /tmp/protoc.zip -d /tmp/protoc
          export PATH="/tmp/protoc/bin:$(go env GOPATH)/bin:$PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          ./internal/usp/proto/generate.sh
          test -z "$(git status --porcelain -uall -- internal/usp/uspproto/)" || { git status --porcelain -uall -- internal/usp/uspproto/; exit 1; }
        working-directory: backend
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        # audit P2.5: pinned, not @latest -- a compromised or yanked
        # govulncheck release must not silently start running in every CI
        # job the moment it's published.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend:
    name: frontend (lint, typecheck+build, test, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The npm bundled with actions/setup-node's node-version: 22 still
      # calls npm's legacy "quick" audit endpoint, which the registry has
      # started rejecting (400: "this endpoint is being retired, use the
      # bulk advisory endpoint instead") -- breaking the audit step below
      # regardless of this repo's own dependencies. A current npm already
      # uses the bulk endpoint. Pinned to an exact version verified
      # locally to audit this project cleanly, for the same reason the
      # @redocly/cli pin above is exact rather than a floating tag.
      - run: npm install -g npm@11.4.2
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run
      - name: OpenAPI specs are valid (drift vs. routes is a Go test)
        # audit P2.5: pinned to an exact version, not the floating @1 major
        # tag -- unlike the GitHub Actions above, Dependabot doesn't track
        # an ad hoc npx invocation inside a run: script, so bumping this
        # is a manual, deliberate edit rather than an automated PR.
        run: |
          npx --yes @redocly/cli@2.51.1 lint ../backend/openapi.yaml --skip-rule operation-4xx-response --skip-rule no-unused-components
          npx --yes @redocly/cli@2.51.1 lint ../backend/openapi-bssadapter.yaml --skip-rule operation-4xx-response --skip-rule no-unused-components
      - name: generated API types match the committed spec (audit P2.5)
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated.ts
      - name: browser E2E + accessibility (Playwright, mocked API)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: audit (production deps must be clean; dev deps at high+)
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=high

  migrations:
    name: migrations (clean DB, idempotent re-run, concurrent runners)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: acs, POSTGRES_PASSWORD: acs, POSTGRES_DB: acs }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acs -d acs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACS_POSTGRES_DSN: postgres://acs:acs@localhost:5432/acs?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: build migrate tool
        run: go build -o /tmp/migrate ./cmd/migrate
      - name: apply to a clean database
        run: /tmp/migrate
      - name: re-run is a no-op (idempotent, checksums verified)
        run: /tmp/migrate
      - name: concurrent runners serialize on the advisory lock
        run: |
          psql "$ACS_POSTGRES_DSN" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          /tmp/migrate & /tmp/migrate & /tmp/migrate &
          wait
          n=$(psql -tA "$ACS_POSTGRES_DSN" -c 'SELECT COUNT(*) FROM schema_migrations')
          f=$(ls internal/store/migrations/*.sql | wc -l)
          echo "applied=$n files=$f"; [ "$n" = "$f" ]
      - name: services start against the migrated schema (fail-closed config)
        env:
          ACS_JWT_SIGNING_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
          ACS_CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key-0123456789
          ACS_INTERNAL_SERVICE_TOKEN: ci-only-internal-service-token-0123456789abcdef
          ACS_DIGEST_USERNAME: cpe
          ACS_DIGEST_PASSWORD: ci-only-digest-password-0123456789
          ACS_BSS_OAUTH_SIGNING_SECRET: ci-only-bss-oauth-secret-0123456789abcdef
          ACS_API_ADDR: ":18080"
          ACS_ADDR: ":17547"
          ACS_STUN_ADDR: "off"
          ACS_BSS_ADDR: ":18090"
        run: |
          go build -o /tmp/acs ./cmd/acs && go build -o /tmp/api ./cmd/api && go build -o /tmp/bssadapter ./cmd/bssadapter
          /tmp/acs & p1=$!; /tmp/api & p2=$!; /tmp/bssadapter & p3=$!
          sleep 5
          for port in 17547 18080 18090; do
            curl -fsS "http://localhost:$port/readyz" || { echo "readiness failed on $port"; exit 1; }
          done
          kill $p1 $p2 $p3; wait || true
      - name: DB-backed integration tests (two-tenant isolation, transfer tokens, service identity, mock-CPE session)
        env:
          ACS_TEST_POSTGRES_DSN: postgres://acs:acs@localhost:5432/acs?sslmode=disable
        run: go test -race -count=1 -p 1 -run Integration ./cmd/api/ ./cmd/acs/  # -p 1: both suites reset the same database, so packages must not run concurrently
      - name: DB-backed repository tests (assignment constraints, Digest replay, lease recovery, dashboard SQL, OAuth revocation, liveness transitions)
        env:
          ACS_TEST_POSTGRES_DSN: postgres://acs:acs@localhost:5432/acs?sslmode=disable
        # These packages' DB-backed tests are not named *Integration*, so the
        # step above never ran them. That includes cmd/acs's
        # TestRepository_RefreshLivenessTransitions, so ./cmd/acs/ is
        # covered here too — this reruns cmd/acs's TestIntegration_* tests
        # as a side effect (harmless) but TestIntegration_CPELoad stays
        # skipped since ACS_TEST_LOAD_DEVICES is unset. -p 1: every one
        # resets the same database.
        run: go test -race -count=1 -p 1 ./internal/store/ ./internal/bss/ ./internal/auth/ ./internal/jobs/ ./cmd/acs/
      - name: placeholder secrets are refused (fail-closed)
        run: |
          set +e
          ACS_JWT_SIGNING_SECRET=change-me ACS_CREDENTIAL_ENCRYPTION_KEY=change-me ACS_INTERNAL_SERVICE_TOKEN=change-me timeout 10 go run ./cmd/api
          rc=$?; set -e
          [ "$rc" -ne 0 ] || { echo "cmd/api started with placeholder secrets"; exit 1; }

  containers:
    name: container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build backend images
        run: |
          for svc in acs api bssadapter; do
            docker build -f backend/Dockerfile.$svc -t acs-$svc:ci backend
          done
      - name: build frontend image
        run: docker build -t acs-frontend:ci frontend
      - name: SBOMs for every image (Syft, SPDX)
        # audit P2.5: install.sh pinned to a released tag (not the `main`
        # branch, which can change under us) plus an explicit version, so
        # the installed Syft binary is fully determined by this line, not
        # by whatever happens to be latest on the day CI runs.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.51.1/install.sh | sh -s -- -b /usr/local/bin v1.51.1
          mkdir -p sbom
          for img in acs-acs acs-api acs-bssadapter acs-frontend; do
            syft "$img:ci" -o spdx-json > "sbom/$img.spdx.json"
          done
      - name: upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sboms
          path: sbom/
          retention-days: 90
      - name: save images for the scan matrix
        # The scan steps below run as separate matrix jobs (audit P2.6:
        # every image that ships, not just acs-api), which don't share
        # this job's local Docker image cache -- ship each image as an
        # artifact instead of rebuilding it per matrix leg.
        run: |
          mkdir -p images
          for img in acs-acs acs-api acs-bssadapter acs-frontend; do
            docker save "$img:ci" -o "images/$img.tar"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images
          path: images/
          retention-days: 1

  scan:
    name: scan images (Trivy, fail on HIGH/CRITICAL fixable)
    needs: containers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [acs-acs, acs-api, acs-bssadapter, acs-frontend]
    steps:
      # Checkout first: it cleans the workspace, so it has to run before
      # the images land in it. Nothing is built here — this is only for
      # .trivyignore.yaml below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: images
          path: images/
      - run: docker load -i "images/${{ matrix.image }}.tar"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Every entry in here carries an expired_at, so an exception
          # cannot quietly outlive its justification — see the file.
          trivyignores: .trivyignore.yaml

  usp-interop:
    name: usp-interop (obuspa reference agent, WebSocket + MQTT 5 + MQTT 3.1.1)
    # Spec §9: protocol code that has never met a real agent is an
    # intention, not a capability. This job runs the Broadband Forum
    # reference USP agent (obuspa) against cmd/uspc over both MTPs and
    # asserts the controller logged a GetResp for Device.DeviceInfo.
    # from it -- needs: [go] so it never runs against a build that
    # already fails.
    needs: [go]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # cmd/uspc's own env (backend/cmd/uspc/config.go, main.go).
      # ACS_USP_CONTROLLER_ID must be >=8 bytes, match
      # ^[A-Za-z0-9._-]+$, and not read as a placeholder -- it becomes
      # this controller's self::<id> endpoint id, which every obuspa
      # factory-reset file in ci/usp/ must name exactly as its
      # Controller.1.EndpointID, or obuspa refuses the record.
      ACS_USP_CONTROLLER_ID: ci-obuspa-interop
      ACS_USP_WS_ADDR: ":9877"
      ACS_USP_WS_PATH: "/usp"
      ACS_USP_MQTT_ADDR: ":1883"
      ACS_USP_MQTT_CONTROLLER_TOPIC: "/usp/controller"
      ACS_USP_ALLOW_PLAINTEXT: "true"
      ACS_USP_HTTP_ADDR: ":8092"
      # Pinned commit, not a floating branch (obuspa has no "v11.0.7"
      # release -- that tag does not exist). This is
      # github.com/BroadbandForum/obuspa's tag v11.0.0-master, the
      # latest master-branch release tag as of 2026-09-11, verified
      # live against the upstream repository before pinning.
      OBUSPA_COMMIT: 2d885f12d7fd345435b5db651b3111cb6d3a879e
      AGENT_ENDPOINT_ID: os::012345-CIAGENT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: build uspc
        working-directory: backend
        run: go build -o /tmp/uspc ./cmd/uspc
      - name: executable bit on assert-getresp.sh (committed as 100755)
        run: test -x ci/usp/assert-getresp.sh
      - name: clone obuspa at the pinned commit
        run: |
          git init -q obuspa-src
          cd obuspa-src
          git remote add origin https://github.com/BroadbandForum/obuspa.git
          git fetch --depth 1 origin "$OBUSPA_COMMIT"
          git checkout -q FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$OBUSPA_COMMIT" ] || { echo "checked out $actual, expected $OBUSPA_COMMIT"; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build obuspa's ci/Dockerfile, unmodified (CoAP compiled in but never configured -- harmless here)
        run: docker build -f obuspa-src/ci/Dockerfile -t obuspa:ci obuspa-src

      - name: "usp-interop: websocket"
        run: |
          rm -f /tmp/uspc-ws.log /tmp/obuspa-ws.log
          /tmp/uspc > /tmp/uspc-ws.log 2>&1 &
          uspc_pid=$!
          ready=0
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8092/readyz >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: uspc did not become ready (GET /readyz) within 20s"
            cat /tmp/uspc-ws.log
            kill "$uspc_pid" 2>/dev/null || true
            exit 1
          fi
          docker run -d --name obuspa-ws --network host \
            -v "$PWD/ci/usp:/ci/usp:ro" \
            obuspa:ci -p -v4 -r /ci/usp/obuspa-websocket.txt -t /etc/obuspa/certs -f /tmp/usp-ws.db
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' obuspa-ws 2>/dev/null)" != "true" ]; then
            echo "FAIL: obuspa-ws container is not running shortly after start"
            docker logs obuspa-ws || true
            docker rm -f obuspa-ws >/dev/null 2>&1 || true
            kill "$uspc_pid" 2>/dev/null || true
            exit 1
          fi
          docker logs -f obuspa-ws > /tmp/obuspa-ws.log 2>&1 &
          logs_pid=$!
          rc=0
          ci/usp/assert-getresp.sh /tmp/uspc-ws.log "$AGENT_ENDPOINT_ID" WebSocket /tmp/obuspa-ws.log || rc=$?
          kill "$logs_pid" 2>/dev/null || true
          docker rm -f obuspa-ws >/dev/null 2>&1 || true
          kill "$uspc_pid" 2>/dev/null || true
          wait "$uspc_pid" 2>/dev/null || true
          exit "$rc"

      - name: "usp-interop: mqtt-v5"
        run: |
          rm -f /tmp/uspc-mqtt5.log /tmp/obuspa-mqtt5.log
          /tmp/uspc > /tmp/uspc-mqtt5.log 2>&1 &
          uspc_pid=$!
          ready=0
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8092/readyz >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: uspc did not become ready (GET /readyz) within 20s"
            cat /tmp/uspc-mqtt5.log
            kill "$uspc_pid" 2>/dev/null || true
            exit 1
          fi
          docker run -d --name obuspa-mqtt5 --network host \
            -v "$PWD/ci/usp:/ci/usp:ro" \
            obuspa:ci -p -v4 -r /ci/usp/obuspa-mqtt-v5.txt -t /etc/obuspa/certs -f /tmp/usp-mqtt5.db
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' obuspa-mqtt5 2>/dev/null)" != "true" ]; then
            echo "FAIL: obuspa-mqtt5 container is not running shortly after start"
            docker logs obuspa-mqtt5 || true
            docker rm -f obuspa-mqtt5 >/dev/null 2>&1 || true
            kill "$uspc_pid" 2>/dev/null || true
            exit 1
          fi
          docker logs -f obuspa-mqtt5 > /tmp/obuspa-mqtt5.log 2>&1 &
          logs_pid=$!
          rc=0
          ci/usp/assert-getresp.sh /tmp/uspc-mqtt5.log "$AGENT_ENDPOINT_ID" MQTT /tmp/obuspa-mqtt5.log || rc=$?
          kill "$logs_pid" 2>/dev/null || true
          docker rm -f obuspa-mqtt5 >/dev/null 2>&1 || true
          kill "$uspc_pid" 2>/dev/null || true
          wait "$uspc_pid" 2>/dev/null || true
          exit "$rc"

      - name: "usp-interop: mqtt-v311"
        run: |
          rm -f /tmp/uspc-mqtt311.log /tmp/obuspa-mqtt311.log
          /tmp/uspc > /tmp/uspc-mqtt311.log 2>&1 &
          uspc_pid=$!
          ready=0
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8092/readyz >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: uspc did not become ready (GET /readyz) within 20s"
            cat /tmp/uspc-mqtt311.log
            kill "$uspc_pid" 2>/dev/null || true
            exit 1
          fi
          docker run -d --name obuspa-mqtt311 --network host \
            -v "$PWD/ci/usp:/ci/usp:ro" \
            obuspa:ci -p -v4 -r /ci/usp/obuspa-mqtt-v311.txt -t /etc/obuspa/certs -f /tmp/usp-mqtt311.db
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' obuspa-mqtt311 2>/dev/null)" != "true" ]; then
            echo "FAIL: obuspa-mqtt311 container is not running shortly after start"
            docker logs obuspa-mqtt311 || true
            docker rm -f obuspa-mqtt311 >/dev/null 2>&1 || true
            kill "$uspc_pid" 2>/dev/null || true
            exit 1
          fi
          docker logs -f obuspa-mqtt311 > /tmp/obuspa-mqtt311.log 2>&1 &
          logs_pid=$!
          rc=0
          ci/usp/assert-getresp.sh /tmp/uspc-mqtt311.log "$AGENT_ENDPOINT_ID" MQTT /tmp/obuspa-mqtt311.log || rc=$?
          kill "$logs_pid" 2>/dev/null || true
          docker rm -f obuspa-mqtt311 >/dev/null 2>&1 || true
          kill "$uspc_pid" 2>/dev/null || true
          wait "$uspc_pid" 2>/dev/null || true
          exit "$rc"

  security:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
