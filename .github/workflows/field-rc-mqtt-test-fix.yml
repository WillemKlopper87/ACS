name: Field RC MQTT test fix

on:
  push:
    branches:
      - fix/field-rc-ci-baseline

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/field-rc-ci-baseline
      - name: Remove half-open TCP probe from StartStop lifecycle test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/usp/mtp/mqtt_test.go')
          text = path.read_text()
          old = '''\t// The broker must be listening: a raw TCP connect succeeds.\n\tc, err := net.DialTimeout("tcp", m.Addr(), 2*time.Second)\n\tif err != nil {\n\t\tt.Fatalf("broker not listening on %s: %v", m.Addr(), err)\n\t}\n\t// Close the listener before the broker shutdown. This lets the accept\n\t// loop finish before Server.Close touches the broker state, avoiding\n\t// Mochi's accept/EstablishConnection race under -race.\n\tdefer c.Close()\n'''
          new = '''\t// Start returning successfully proves Server.Serve attached the bound\n\t// listener. Do not open a raw TCP socket here: a socket that never sends\n\t// MQTT CONNECT remains half-established inside mochi-mqtt and can race\n\t// Server.Close's ClientsWg.Wait under -race. Real listener acceptance is\n\t// covered below by the allow/deny wire tests, which complete CONNECT and\n\t// CONNACK before shutdown.\n'''
          if old not in text:
              raise SystemExit('expected TestMQTTStartStop probe block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/usp/mtp/mqtt_test.go
          git diff --cached --check
          git commit -m "test(usp): avoid half-open MQTT shutdown race"
          git push origin HEAD:fix/field-rc-ci-baseline
