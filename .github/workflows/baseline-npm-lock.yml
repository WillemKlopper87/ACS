name: Baseline npm lock refresh

on:
  push:
    branches:
      - fix/tmf-programme-baseline

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/tmf-programme-baseline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile from patched constraints
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=high
      - name: Commit lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/baseline-npm-lock.yml
          git commit -m "fix(frontend): refresh lockfile for patched dependencies"
          git push origin HEAD:fix/tmf-programme-baseline
