name: Wire TMF639 slice

on:
  push:
    branches:
      - feat/tmf639-resource-inventory

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/tmf639-resource-inventory
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
      - name: Register TMF639 routes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/cmd/api/routes.go')
          text = p.read_text()
          marker = '\troute("GET", "/api/v1/devices/{id}", ro, h.getDevice)\n'
          block = (
              '\t// TMF639 Resource Inventory projects the tenant-scoped device inventory.\n'
              '\troute("GET", "/tmf-api/resourceInventoryManagement/v5/resource", ro, h.listTMF639Resources)\n'
              '\troute("GET", "/tmf-api/resourceInventoryManagement/v5/resource/{id}", ro, h.getTMF639Resource)\n'
          )
          if '/tmf-api/resourceInventoryManagement/v5/resource' not in text:
              if marker not in text:
                  raise SystemExit('route insertion marker not found')
              p.write_text(text.replace(marker, marker + block, 1))
          PY
          gofmt -w backend/cmd/api/routes.go backend/cmd/api/tmf639_handlers.go backend/internal/devices/window.go backend/internal/tmf/resourceinventory/*.go backend/cmd/api/openapi_drift_test.go
      - name: Validate TMF639 contract
        run: npx --yes @redocly/cli@2.51.1 lint backend/openapi-tmf639.yaml --skip-rule operation-4xx-response --skip-rule no-unused-components
      - name: Run focused Go tests
        working-directory: backend
        run: go test ./internal/tmf/... ./internal/devices ./cmd/api
      - name: Commit wired slice and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmf639-wire.yml
          git add backend/cmd/api/routes.go backend/cmd/api/tmf639_handlers.go backend/cmd/api/openapi_drift_test.go backend/internal/devices/window.go backend/internal/tmf/resourceinventory backend/openapi-tmf639.yaml
          git commit -m "feat(tmf639): wire read-only resource inventory"
          git push origin HEAD:feat/tmf639-resource-inventory
