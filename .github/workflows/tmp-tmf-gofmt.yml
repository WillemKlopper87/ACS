name: Temporary TMF Go cleanup

on:
  push:
    branches:
      - feat/tmf-oauth-policy-clean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/tmf-oauth-policy-clean
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Normalize replayed Go and policy tests
        working-directory: backend
        run: |
          sed -i '/^[[:space:]]*"errors"$/d' cmd/bssadapter/tmf641.go
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/bss/oauth_policy_test.go')
          s = p.read_text()
          s = s.replace(
              'want: OAuthPolicy{Scopes: []string{ScopeTMFRead}, GlobalAccess: true},',
              'want: OAuthPolicy{Scopes: []string{ScopeTMFRead}, AccountIDs: []string{}, GlobalAccess: true},',
          )
          s = s.replace(
              'want: OAuthPolicy{},',
              'want: OAuthPolicy{Scopes: []string{}, AccountIDs: []string{}},',
              1,
          )
          p.write_text(s)
          PY
          gofmt -w cmd/api/bss_admin_handlers.go cmd/bssadapter/oauth_handlers.go cmd/bssadapter/tmf638.go cmd/bssadapter/tmf640.go cmd/bssadapter/tmf641.go cmd/bssadapter/tmf642_688.go cmd/bssadapter/tmf656.go cmd/bssadapter/tmf_authz.go cmd/bssadapter/tmf_authz_test.go internal/auth/jwt.go internal/auth/jwt_test.go internal/bss/oauth.go internal/bss/oauth_policy_test.go
          go test ./internal/auth ./internal/bss ./cmd/bssadapter
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd backend/internal/auth backend/internal/bss
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(tmf): normalize OAuth replay Go sources"
          git push origin HEAD:feat/tmf-oauth-policy-clean
