name: TMF programme baseline repair

on:
  push:
    branches:
      - fix/tmf-programme-baseline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/tmf-programme-baseline

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Repair baseline files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/openapi.yaml")
          text = path.read_text()
          old = 'location: { type: string, description: Free-text label, e.g. "Rack 4, POP-West" }'
          new = 'location: { type: string, description: \'Free-text label, e.g. "Rack 4, POP-West"\' }'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit("expected OpenAPI location description not found")
          PY

          cd backend
          go mod tidy
          cd ..

      - name: Commit normalized baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.yaml backend/go.mod backend/go.sum
          if git diff --cached --quiet; then
            echo "Baseline already normalized"
            exit 0
          fi
          git commit -m "fix(ci): normalize OpenAPI and vulnerable Go dependency"
          git push origin HEAD:fix/tmf-programme-baseline
