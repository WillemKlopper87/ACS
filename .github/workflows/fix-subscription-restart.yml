name: Fix subscription restart rearm

on:
  push:
    branches:
      - fix/tmf-programme-baseline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/tmf-programme-baseline
      - name: Patch restart persistence proof
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('ci/usp/assert-subscription.sh')
          text = p.read_text()
          marker = '''add_succeeded_count() {
            local n
            n=$(grep 'msg="uspc: subscription reconciler: Add succeeded"' "$uspc_log" 2>/dev/null \\
              | grep -c "subscription_id=$sub_id" || true)
            echo "${n:-0}"
          }
'''
          helper = marker + '''
          # OB-USP-Agent persists the Controller MTP Enable=true value across a
          # process restart, but its WebSocket client state machine returns in a
          # disabled runtime state after the preceding allowlist refusal. Preserve
          # the real restart/database-persistence proof and explicitly cycle the
          # same persisted MTP once the restarted agent CLI is responsive.
          restart_and_rearm_controller_mtp() {
            echo "restarting $container and re-arming its persisted controller MTP"
            docker restart "$container" >/dev/null

            local ready=0 out=""
            for _ in $(seq 1 20); do
              out=$(docker exec "$container" obuspa -c get 'Device.LocalAgent.Controller.1.MTP.1.Enable' 2>&1 || true)
              if echo "$out" | grep -q '=>'; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              fail "obuspa CLI did not become responsive after restart -- last output:\n$out"
            fi

            docker exec "$container" obuspa -c set 'Device.LocalAgent.Controller.1.MTP.1.Enable' 'false' >/dev/null
            docker exec "$container" obuspa -c set 'Device.LocalAgent.Controller.1.MTP.1.Enable' 'true' >/dev/null

            out=$(docker exec "$container" obuspa -c get 'Device.LocalAgent.Controller.1.MTP.1.Enable' 2>&1 || true)
            if ! echo "$out" | grep -qi '=> true'; then
              fail "controller MTP was not persisted enabled after restart re-arm -- output:\n$out"
            fi
            echo "OK: restarted agent retained its database and controller MTP was re-armed"
          }
'''
          if marker not in text:
              raise SystemExit('add_succeeded_count marker not found')
          text = text.replace(marker, helper, 1)
          old = 'docker restart "$container" >/dev/null'
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly two restart calls, found {text.count(old)}')
          text = text.replace(old, 'restart_and_rearm_controller_mtp', 2)
          p.write_text(text)
          PY
          bash -n ci/usp/assert-subscription.sh
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/usp/assert-subscription.sh
          git commit -m "fix(ci): rearm OBUSPA MTP across subscription restart"
          git push origin HEAD:fix/tmf-programme-baseline
