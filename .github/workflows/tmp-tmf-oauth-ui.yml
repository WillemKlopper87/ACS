name: Temporary TMF OAuth admin completion

on:
  push:
    branches:
      - feat/tmf-oauth-policy-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/tmf-oauth-policy-clean
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply OAuth admin contract and UI changes
        run: python3 .github/scripts/tmp-tmf-oauth-ui.py
      - name: Regenerate frontend API contract
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run lint
          npm run build
          npm test -- --run
      - name: Commit completed OAuth admin surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.yaml frontend/src/api/generated.ts frontend/src/api/types.ts frontend/src/api/client.ts frontend/src/screens/BSSIntegration.tsx
          git diff --cached --check
          git commit -m "feat(tmf): expose OAuth policy in admin API and UI"
          git push origin HEAD:feat/tmf-oauth-policy-clean
