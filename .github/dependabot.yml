version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-deps: { patterns: ["*"] }
  # No github-actions entry: Actions is not used on this repository (no minutes),
  # so a version bump of a workflow action cannot be tested. Checks run with
  # scripts/ci-local.sh (docs/LOCAL-CI.md). Add it back if Actions returns.
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly }
