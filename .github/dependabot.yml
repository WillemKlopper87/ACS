version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-deps: { patterns: ["*"] }
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript API, which
      # openapi-typescript needs to generate src/api/generated.ts; there is no
      # release of it for TypeScript 7 yet. Drop this when there is.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # No github-actions entry: Actions is not used on this repository (no minutes),
  # so a version bump of a workflow action cannot be tested. Checks run with
  # scripts/ci-local.sh (docs/LOCAL-CI.md). Add it back if Actions returns.
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly }
