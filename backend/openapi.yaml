        overlay_ip: { type: string }
        status: { type: string, enum: [ENROLLED, REVOKED] }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }

    VPNEnrollResult:
      type: object
      properties:
        peer: { $ref: "#/components/schemas/VPNPeer" }
