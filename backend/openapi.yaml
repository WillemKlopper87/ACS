        token_configured: { type: boolean }
        error: { type: string, nullable: true }

    BSSAdapterCallResult:
      type: object
      properties:
        description: { type: string }
        method: { type: string }
        url: { type: string }
        status_code: { type: integer }
        latency_ms: { type: number }
        body: { type: string }
        error: { type: string, nullable: true }

    BSSOAuthClient:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
