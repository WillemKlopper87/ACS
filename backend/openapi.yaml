        revoked_at: { type: string, format: date-time, nullable: true }

    BSSOAuthClientCreateResult:
      type: object
      properties:
        client: { $ref: "#/components/schemas/BSSOAuthClient" }
        client_secret: { type: string, description: "Shown exactly once — bcrypt-hashed thereafter, never retrievable again" }

    CLICredential:
      type: object
      properties:
        id: { type: string }
        device_id: { type: string }
        protocol: { type: string, enum: [SSH, TELNET] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        created_at: { type: string, format: date-time }

    WebGUIConfig:
      type: object
      properties:
        configured: { type: boolean }
        device_id: { type: string }
