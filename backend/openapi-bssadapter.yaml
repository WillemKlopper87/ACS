openapi: 3.0.3
info:
  title: ACS BSS/CRM Integration Adapter API
  version: "1.0.0"
  description: >-
    The external-facing REST API served by cmd/bssadapter (build plan §5,
    bss-integration-guide.md). This is the boundary an external BSS/CRM
    (Salesforce Comm Cloud, Amdocs, Netcracker, a custom operator CRM)
    integrates against — it never talks to the CWMP gateway or Postgres
    directly, only through this adapter's mapping/order/webhook surface,
    per design doc v3's "Decoupled Identity" principle: the ACS stays
    keyed on Device UUID / OUI+SerialNumber, the BSS owns the account
    relationship.

    Closes the "OpenAPI spec — still deferred" gap tracked in
    tr069-acs-build-plan.md §10, alongside openapi.yaml for the internal
    operator API. Hand-written against cmd/bssadapter/*.go's actual
    request/response structs as of this pass — cross-check
    bss-integration-guide.md for the fuller integration-facing narrative
    (retry semantics, TM Forum shape notes, troubleshooting workflow).

    Every error response is a JSON envelope: {"error": "<ErrCode>",
    "message": "<human text>"} — unlike the internal operator API
    (openapi.yaml), which returns plain text. This is deliberate: this
    API's caller is an external system parsing responses programmatically,
    that one's is an operator console.
servers:
  - url: http://localhost:8090
    description: Local dev (ACS_BSS_ADDR default)

security:
  - bearerAuth: []
  - oauth2ClientCredentials: []

tags:
  - name: Events
    description: Event replay and the integration event envelope
  - name: Auth
    description: OAuth2 client-credentials token issuance (build plan §9, supersedes the legacy shared token)
  - name: Mappings
    description: "Workflow A — durable account→device mapping"
  - name: Orders
    description: "Workflow B — order dispatch, idempotent on external_order_id"
  - name: Jobs
    description: "Workflow C — job status polling"
  - name: Webhooks
    description: "Workflow C alternative — JOB_COMPLETED push notifications, HMAC-signed"

paths:
  /bss/v1/oauth/token:
    post:
      tags: [Auth]
      summary: RFC 6749 §4.4 client-credentials grant — issues a 1-hour bearer JWT
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string, description: "Or use HTTP Basic auth instead" }
                client_secret: { type: string, description: "Or use HTTP Basic auth instead" }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
        "401": { $ref: "#/components/responses/Error" }

  /bss/v1/mappings:
    post:
      tags: [Mappings]
      summary: Upsert an account-device mapping, resolved by oui_serial against the real devices table
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
          description: "Optional. Per account, kept 24 hours. A retry with the same key and body gets the first answer again (status, body, Location) with Idempotent-Replayed: true; the same key with another body is 409 ErrIdempotencyKeyReused; a retry while the first runs is 409 ErrIdempotencyKeyInFlight with Retry-After. 5xx answers are not kept."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, oui_serial]
              properties:
                account_id: { type: string }
                oui_serial: { type: string }
                device_uuid: { type: string, description: "Optional — if supplied, must match what oui_serial actually resolves to" }
                service_plan: { type: string }
                role: { type: string, enum: [gateway, ont, extender, stb, ata, other], description: "Optional. Defaults to gateway." }
                pre_provision: { type: boolean, description: "For a device the ACS has not seen yet: record a sale (a PLANNED onboarding) and answer 202 instead of 404. The mapping is written PENDING_ACTIVE when the CPE first connects and becomes ACTIVE when its onboarding reaches IN_SERVICE. See docs/ONBOARDING.md." }
                iccid: { type: string, description: "With pre_provision: the SIM sold with the CPE; the onboarding holds if the CPE reports another. Never echoed back." }
                imsi: { type: string, description: "With pre_provision: as iccid. Its MCC+MNC is also checked against the plan's allowed networks." }
                place:
                  type: object
                  description: "With pre_provision: where the CPE is installed. id is the BSS premise reference; a site is created on first use."
                  properties:
                    id: { type: string }
                    name: { type: string }
                    street: { type: string }
                    city: { type: string }
                    postalCode: { type: string }
                    country: { type: string }
      responses:
        "200": { description: Mapping created/updated, content: { application/json: { schema: { $ref: "#/components/schemas/Mapping" } } } }
        "202":
          description: "pre_provision only: the device is unknown, so a sale was recorded and the mapping waits for the CPE. Location and href point to the sale read."
          headers:
            Location: { schema: { type: string }, description: "/bss/v1/onboardings/{onboarding_id}" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: string }
                  oui_serial: { type: string }
                  service_plan: { type: string }
                  role: { type: string }
                  status: { type: string, enum: [AWAITING_DEVICE] }
                  onboarding_id: { type: string }
                  onboarding_state: { type: string }
                  href: { type: string, description: "The sale read, GET /bss/v1/onboardings/{onboarding_id}" }
                  plan_matched: { type: boolean, description: "Whether service_plan names an ACS service plan. False with a PLAN_NOT_FOUND warning when a code was given that matches none." }
                  warnings: { type: array, items: { $ref: "#/components/schemas/SaleWarning" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "ErrDeviceNotMapped — no device found for that oui_serial (and pre_provision not set)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: "ErrRoleAlreadyAssigned — the account already has an active device in that role", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/mappings/{account_id}:
    get:
      tags: [Mappings]
      summary: List every device mapped to an account
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Mapping" } }

  /bss/v1/mappings/{account_id}/capabilities:
    get:
      tags: [Mappings]
      summary: Read the mapped device's discovered data-model root and writable parameter paths for safe OSS action planning
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [gateway, ont, extender, stb, ata, other] }, description: "Optional. Defaults to gateway." }
      responses:
        "200":
          description: Capability evidence only; parameter values and credentials are never returned
          content:
            application/json:
              schema:
                type: object
                required: [account_id, device_id, role, data_model_root, discovery_complete, writable_parameters]
                properties:
                  account_id: { type: string }
                  device_id: { type: string }
                  role: { type: string }
                  data_model_root: { type: string, enum: [DEVICE2, IGD1, UNKNOWN] }
                  discovery_complete: { type: boolean }
                  writable_parameters: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /bss/v1/orders:
    post:
      tags: [Orders]
      summary: >-
        Dispatch a business action as canonical parameter writes, queuing an ACS job.
        Idempotent on external_order_id — a retried submission returns the existing
        order's current status rather than double-dispatching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_order_id, account_id, action]
              properties:
                external_order_id: { type: string, description: "BSS-assigned idempotency key" }
                account_id: { type: string }
                service_type: { type: string }
                action: { type: string, enum: [MODIFY_WIFI, SUSPEND, ACTIVATE], description: "SUSPEND/ACTIVATE need ACS_WALLED_GARDEN_* configured server-side or return 400 (build plan §5.3)" }
                role: { type: string, enum: [gateway, ont, extender, stb, ata, other], description: "Optional. Defaults to gateway." }
                parameters:
                  type: object
                  additionalProperties: { type: string }
                  description: "Business parameters, e.g. {wifi_ssid, wifi_password} for MODIFY_WIFI"
      responses:
        "202": { description: "Queued (or the existing order's current status, if a retry)", content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: ErrDeviceNotMapped, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: ErrACSUnreachable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/actions/preflight:
    post:
      tags: [Orders]
      summary: Validate and resolve an action against the mapped device without creating an order or queuing a CPE job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, action]
              properties:
                account_id: { type: string }
                action: { type: string, enum: [MODIFY_WIFI, SUSPEND, ACTIVATE] }
                role: { type: string, enum: [gateway, ont, extender, stb, ata, other], description: "Optional. Defaults to gateway." }
                parameters: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: Resolved device and canonical parameter writes; no state was changed
          content:
            application/json:
              schema:
                type: object
                required: [account_id, device_id, action, parameters]
                properties:
                  account_id: { type: string }
                  device_id: { type: string }
                  action: { type: string }
                  parameters:
                    type: array
                    items: { $ref: "#/components/schemas/ParameterWrite" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /bss/v1/jobs/{command_key}:
    get:
      tags: [Jobs]
      summary: Poll a dispatched order's underlying job status (Workflow C)
      parameters:
        - { name: command_key, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JobStatus" } } } }
        "404": { description: ErrJobNotFound, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: ErrACSUnreachable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/devices/{device_id}/reconciliation:
    get:
      tags: [Jobs]
      summary: Compare this device's BSS order history against its current ACS-reported parameter state
      description: >-
        Read-only drift detection: for each canonical parameter a dispatched
        order last touched, reports whether the device's current cache
        matches, drifted, or the order's job is still unconfirmed. Nothing
        here queues a corrective order.
      parameters:
        - { name: device_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceReconciliation" } } } }
        "404": { description: No BSS order history for that device, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: ErrACSUnreachable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/webhooks:
    post:
      tags: [Webhooks]
      summary: Subscribe to events (JOB_COMPLETED and the stream events of docs/integration/09-events.md) instead of polling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_url, secret, event_types]
              properties:
                account_id: { type: string, nullable: true, description: "Required for account-scoped OAuth clients. Omit only with a globally-authorized client or the deprecated shared token." }
                target_url: { type: string }
                secret: { type: string, description: "HMAC-SHA256 signing secret — deliveries carry Webhook-Id, Webhook-Timestamp, and Webhook-Signature: v1,<mac> over '<Webhook-Id>.<Webhook-Timestamp>.<raw body>'. A whsec_<base64> secret (real Standard Webhooks format) gets base64-decoded key material and a base64-encoded <mac>, fully wire-compatible with an off-the-shelf Standard Webhooks verifier; any other secret keeps the legacy raw-key, hex-encoded scheme." }
                event_types: { type: array, items: { type: string, enum: [JOB_COMPLETED, DeviceSeen, DeviceUnreachable, FirmwareChanged, CellularStateChanged, DeviceFault, DeviceRecovered, OnboardingStateChangeEvent, IdentityMismatch] }, description: "Not validated: an unknown type is stored and never matches, so check the spelling." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookSubscription" } } } }
    get:
      tags: [Webhooks]
      summary: List one account's subscriptions, or every subscription for a globally-authorized caller
      parameters:
        - { name: account_id, in: query, required: false, schema: { type: string }, description: "Required for account-scoped OAuth clients; omit only with global authorization." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/WebhookSubscription" } } } } } } }

  /bss/v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /bss/v1/onboardings/{id}/retry:
    post:
      tags: [Mappings]
      summary: Start a held (ON_HOLD) or FAILED sale again after fixing the cause (tmf:execute for customer-bound clients)
      description: "The sale goes back to PLANNED, or CONTACTED once its CPE connected, and the ACS re-checks everything on the CPE's next contact: a retry that fixed nothing holds again. Emits an OnboardingStateChangeEvent."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The sale after the retry, content: { application/json: { schema: { $ref: "#/components/schemas/Sale" } } } }
        "404": { description: "Unknown, or another customer's, sale", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: "ErrSaleWrongState: the sale is not ON_HOLD or FAILED", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/onboardings/{id}/cancel:
    post:
      tags: [Mappings]
      summary: Cancel a sale that is not in service (tmf:execute for customer-bound clients)
      description: "The sale is CANCELLED: its serial is free for a new sale, an account mapping it wrote is ended (corrected), a TMF641 item waiting for it FAILS. End a sale in service with a TMF641 delete. Emits an OnboardingStateChangeEvent."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The cancelled sale, content: { application/json: { schema: { $ref: "#/components/schemas/Sale" } } } }
        "404": { description: "Unknown, or another customer's, sale", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: "ErrSaleWrongState: the sale is IN_SERVICE or already CANCELLED", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/devices:
    get:
      tags: [Mappings]
      summary: The caller's customer's devices with their current account and reachability, in pages (tmf:read for customer-bound clients)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: "Opaque; next_cursor of the previous page" }
        - { name: customer_id, in: query, schema: { type: string }, description: "Global clients only (required for them); a customer-bound client reads its own customer" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CustomerDevice" } }
                  next_cursor: { type: string, description: "Absent on the last page" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "customer_id names another customer", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/onboardings/{id}:
    get:
      tags: [Mappings]
      summary: Read a sale (a pre-provisioned onboarding) of one of the caller's accounts (tmf:read for customer-bound clients)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "onboarding_id from the 202 of a pre_provision mapping, or from an OnboardingStateChangeEvent" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Sale" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "Unknown, or another customer's, sale", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  /bss/v1/events:
    get:
      tags: [Events]
      summary: Replay the caller's events after a cursor (tmf:read for customer-bound clients)
      description: |
        Events of the caller's customer with sequence > after, oldest first, in the same envelope as webhooks
        (docs/integration/09-events.md). A customer-bound client reads its own customer; a global client names one
        with customer_id (empty = events that belong to no customer); account-listed clients are refused. Page by
        passing next_after back as after. Sequence numbers increase strictly per customer but may skip a number; a
        skipped number is never a lost event. gap=true means events after the cursor were removed by retention.
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: customer_id, in: query, required: false, schema: { type: string }, description: "Global clients only" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [events, next_after, latest_sequence, purged_through, gap]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/EventEnvelope" } }
                  next_after: { type: integer, format: int64 }
                  latest_sequence: { type: integer, format: int64 }
                  purged_through: { type: integer, format: int64 }
                  gap: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "insufficient_scope, ErrClientNotCustomerBound, or ErrReplayNeedsCustomer (account-listed client)" }

  /bss/v1/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: The subscription's deliveries, newest first, with status, attempts and the last error (tmf:read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, DELIVERED, FAILED] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "404": { description: No such subscription for this caller }

  /bss/v1/webhooks/{id}/deliveries/{delivery_id}/redeliver:
    post:
      tags: [Webhooks]
      summary: Queue a delivery again from its first attempt, with the same Webhook-Id (tmf:write)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: delivery_id, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Queued }
        "404": { description: No such subscription or delivery for this caller }

  /bss/v1/webhooks/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Replace the signing secret; both secrets sign until the overlap ends (tmf:write)
      description: |
        The new secret is returned once. Until previous_secret_valid_until, Webhook-Signature carries one signature per
        secret ("v1,<new> v1,<previous>"); verify by accepting if any signature matches.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overlap_seconds: { type: integer, minimum: 0, maximum: 604800, default: 86400 }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  secret: { type: string }
                  previous_secret_valid_until: { type: string, format: date-time }
        "404": { description: No such subscription for this caller }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Either an OAuth2 client-credentials token from POST /bss/v1/oauth/token
        (recommended, build plan §9) or the legacy shared ACS_BSS_API_TOKEN
        (deprecated but still accepted so existing integrations don't break
        mid-migration — bss-integration-guide.md §3).
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /bss/v1/oauth/token
          scopes: {}

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    EventEnvelope:
      type: object
      required: [id, type, occurred_at, sequence, data]
      description: "Every integration event, in webhooks and replay. Webhook bodies also keep the older TMF688 keys (eventId, eventType, eventTime, sourceKey, accountId, deviceId, serviceId, event)."
      properties:
        id: { type: string }
        type:
          type: string
          description: "DeviceSeen, DeviceUnreachable, FirmwareChanged, DeviceFault, DeviceRecovered, CellularStateChanged, OnboardingStateChangeEvent, IdentityMismatch, and events posted to TMF688"
        occurred_at: { type: string, format: date-time }
        sequence: { type: integer, format: int64, description: "Strictly increasing per customer" }
        customer_id: { type: string, nullable: true }
        account_id: { type: string, nullable: true }
        device:
          type: object
          nullable: true
          properties:
            id: { type: string }
            oui_serial: { type: string }
        data: { type: object, description: "Event-specific; never secrets or full SIM identifiers" }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string, description: "The Webhook-Id header of every attempt" }
        event_id: { type: string, description: "The envelope id of the event delivered; absent for JOB_COMPLETED" }
        event_sequence: { type: integer, format: int64, description: "The event's sequence in its customer's stream; absent for JOB_COMPLETED" }
        event_type: { type: string }
        status: { type: string, enum: [PENDING, DELIVERED, FAILED] }
        attempts: { type: integer }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [type, title, status, detail, code, error, message]
      description: "RFC 9457 problem details (application/problem+json when the client sends Accept: application/problem+json, else application/json), keeping the older error/message keys. code is stable within the problem contract version (v1 in type)."
      properties:
        type: { type: string, example: "urn:acs:problem:v1:ErrInvalidRequest" }
        title: { type: string, example: Invalid request }
        status: { type: integer, example: 400 }
        detail: { type: string }
        code: { $ref: "#/components/schemas/ProblemCode" }
        error: { $ref: "#/components/schemas/ProblemCode" }
        message: { type: string, description: "Same as detail" }

    ProblemCode:
      type: string
      description: "Closed list. New codes come only with a new problem contract version."
      enum: [ErrInvalidRequest, ErrNotFound, ErrInternal, ErrACSUnreachable, ErrDeviceNotMapped, ErrDeviceNotFound, ErrUnsupportedAction, ErrUnauthorized, ErrJobNotFound, ErrInvalidRelation, ErrConflict, ErrServiceTerminated, ErrServiceNotActive, ErrRoleAlreadyAssigned, ErrDeviceAlreadyAssigned, ErrReplayNeedsCustomer, ErrRateLimited, ErrPreProvisionRefused, ErrIdempotencyKeyReused, ErrIdempotencyKeyInFlight, ErrSaleWrongState, ErrGlobalClientsDisabled, ErrClientNotCustomerBound, invalid_token, insufficient_scope, invalid_request, invalid_client, invalid_scope, unsupported_grant_type, server_error]

    Mapping:
      type: object
      properties:
        account_id: { type: string }
        device_uuid: { type: string }
        oui_serial: { type: string }
        service_plan: { type: string }
        status: { type: string, enum: [PENDING_ACTIVE, ACTIVE, SUSPENDED, TERMINATED] }
        role: { type: string, enum: [gateway, ont, extender, stb, ata, other], description: "What the device does for this account. One active device per role per account." }
        plan_matched: { type: boolean, description: "On create, when service_plan was given: whether it names an ACS service plan" }
        warnings: { type: array, items: { $ref: "#/components/schemas/SaleWarning" } }

    CustomerDevice:
      type: object
      required: [id, oui_serial, online_status]
      properties:
        id: { type: string }
        oui_serial: { type: string }
        account_id: { type: string, description: "Its current BSS account, if mapped" }
        role: { type: string }
        mapping_status: { type: string, enum: [PENDING_ACTIVE, ACTIVE, SUSPENDED, TERMINATED] }
        online_status: { type: string, enum: [ONLINE, OFFLINE, UNREACHABLE] }
        last_inform_at: { type: string, format: date-time }

    SaleWarning:
      type: object
      required: [code, message]
      description: "Something the BSS should fix that does not stop the sale."
      properties:
        code: { type: string, enum: [PLAN_NOT_FOUND] }
        message: { type: string }

    Sale:
      type: object
      required: [id, href, account_id, serial_number, plan_matched, state, created_at, updated_at]
      description: "A BSS sale and where it is. Timestamps are UTC. No SIM identifiers; reason carries only masked ones."
      properties:
        id: { type: string }
        href: { type: string }
        account_id: { type: string }
        external_id: { type: string, description: "The TMF641 order externalId that created the sale, if any" }
        oui: { type: string }
        serial_number: { type: string }
        role: { type: string }
        service_plan: { type: string }
        plan_matched: { type: boolean }
        state: { type: string, enum: [PLANNED, CONTACTED, SECURED, DISCOVERED, CONFIGURING, IN_SERVICE, ON_HOLD, FAILED, CANCELLED] }
        reason_code: { type: string, description: "As OnboardingStateChangeEvent.reasonCode, including TTL_EXPIRED" }
        reason: { type: string }
        device_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contacted_at: { type: string, format: date-time }
        in_service_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "While PLANNED: when the sale is cancelled (TTL_EXPIRED) if no CPE has connected. ACS_BSS_SALE_TTL, default 30 days." }
        warnings: { type: array, items: { $ref: "#/components/schemas/SaleWarning" } }

    Order:
      type: object
      properties:
        order_tracking_id: { type: string }
        command_key: { type: string }
        status: { type: string }
        timestamp: { type: string, format: date-time }

    ParameterWrite:
      type: object
      required: [name, value]
      properties:
        name: { type: string, description: "Resolved device data-model path" }
        value: { type: string }
        type: { type: string, example: string }

    JobStatus:
      type: object
      properties:
        command_key: { type: string }
        device_id: { type: string }
        type: { type: string }
        status: { type: string, enum: [QUEUED, RPC_SENT, IN_PROGRESS, AWAITING_TRANSFER_COMPLETE, AWAITING_DIAGNOSTICS_COMPLETE, SUCCESS, FAILED, TIMEOUT] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        fault_code: { type: string, nullable: true }
        fault_string: { type: string, nullable: true }

    WebhookSubscription:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string, nullable: true }
        target_url: { type: string }
        event_types: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    ReconciliationField:
      type: object
      properties:
        path: { type: string, description: "Resolved device data-model path the order wrote" }
        intended_value: { type: string, description: "The value the most recent order for this path sent" }
        actual_value: { type: string, description: "The device's currently cached value — omitted when status is unconfirmed or unverifiable" }
        actual_updated_at: { type: string, format: date-time }
        status: { type: string, enum: [match, drift, unknown, unconfirmed, unverifiable] }
        external_order_id: { type: string }
        ordered_at: { type: string, format: date-time }

    DeviceReconciliation:
      type: object
      properties:
        device_id: { type: string }
        account_id: { type: string }
        checked_at: { type: string, format: date-time }
        fields: { type: array, items: { $ref: "#/components/schemas/ReconciliationField" } }
